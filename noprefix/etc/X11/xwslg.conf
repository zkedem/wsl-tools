#
# ServerFlags section
# Specifies global X server options.
# This section and its entries are optional.
#
# Option "BlankTime" "<time>" Sets the inactivity timeout in minutes for the blank phase of the screensaver; equivalent to -s flag. Default: 10
# Option "Xinerama" Enable or disable XINERAMA extension. Default: Disable
# Option "IndirectGLX" Enable or disable indirect GLX contexts. Default: Disable
#
Section "ServerFlags"
	#Option "BlankTime" "10"
	#Option "Xinerama" "Disable"
	#Option "IndirectGLX" "Disable"
EndSection

#
# Extensions section
# Specifies which X11 protocol extensions should be enabled or disabled.
# This section and its entries are optional.
#
Section "Extensions"
	#Option "Generic Event Extension" "Disable"
	#Option "SHAPE" "Disable"
	#Option "MIT-SHM" "Disable"
	#Option "XInputExtension" "Disable"
	#Option "XTEST" "Disable"
	#Option "BIG-REQUESTS" "Disable"
	#Option "SYNC" "Disable"
	#Option "XKEYBOARD" "Disable"
	#Option "XC-MISC" "Disable"
	#Option "SECURITY" "Disable"
	#Option "XINERAMA" "Disable"
	#Option "XFIXES" "Disable"
	#Option "XFree86-Bigfont" "Disable"
	#Option "RENDER" "Disable"
	#Option "RANDR" "Disable"
	#Option "COMPOSITE" "Disable"
	#Option "DAMAGE" "Disable"
	#Option "MIT-SCREEN-SAVER" "Disable"
	#Option "DOUBLE-BUFFER" "Disable"
	#Option "RECORD" "Disable"
	#Option "DPMS" "Disable"
	#Option "Present" "Disable"
	#Option "DRI3" "Disable"
	#Option "X-Resource" "Disable"
	#Option "XVideo" "Disable"
	#Option "XVideo-MotionCompensation" "Disable"
	#Option "SELinux" "Disable"
	#Option "GLX" "Disable"
EndSection

#
# Vendor section
# Provides configuration information specific to Xwslg.
# This section and its entries are optional.
# This section may be specified more than once.
# Option descriptions are taken from the Xwayland man page.
#
# Identifier "<name>" If set, ignore section unless the executable name of the program that called Xwslg matches this entry.
# Option "Extend" "<name>" Inherit configuration information from other Vendor section whose Identifier entry matches this entry.
# Option "decorate" Add decorations to the Xwayland root window when running rootful. Default: Disable
# Option "enable-ei-portal" Enable support for the XDG portal for input emulation. Default: Disable
# Option "fullscreen" Set the Xwayland window fullscreen when running rootful. Default: Disable
# Option "geometry" "<WxH|auto>" Sets the geometry of the window when running rootful. Default: 640x480
# Option "glamor" "<gl|es|off>" Use given rendering API for Glamor acceleration; not compatible with shm option. Default: gl
# Option "hidpi" Adjust to the scale of the outputs when running rootful in windowing mode. Default: Disable
# Option "host-grab" Inhibit host keyboard shorcuts and confine the pointer when running rootful. Default: Disable
# Option "initfd" "<fd>" Add the given fd as a listen socket for initialization of X clients.
# Option "listen" "<fd>" Deprecated; equivalent to listenfd option.
# Option "listenfd" "<fd>" Add given fd as a listen socket.
# Option "noTouchPointerEmulation" If enabled, do not use touch pointer emulation. Default: Disable
# Option "force-xrandr-emulation" Force additional non-native modes to be exposed when viewporter is not supported by the Wayland compositor. Default: Disable
# Option "nokeymap" Instructs Xwayland to ignore the keymap set by the Wayland compositor. Default: Disable
# Option "output" "<name>" Specifies on which output Xwayland fullscreen rootful should be placed.
# Option "rootless" Run Xwayland rootless, so that X clients integrate seamlessly with Wayland clients in a Wayland desktop. Default: Disable
# Option "shm" Force the shared memory backend instead of glamor (if available) for passing buffers to the Wayland server; not compatible with glamor option. Default: Disable
# Option "verbose" "<n>" Sets the verbosity level for information printed on stderr. Default: 0
# Option "wm" "<fd>" This option is used by the Wayland server to pass Xwayland the socket where the X window manager client connects, when the rootless option is enabled.
# Option "OtherOptions" "<arg1> <arg2> ..." Additional command-line options to pass to Xwslg; empty by default.
#
Section "Vendor"
	#Option "decorate" "Disable"
	#Option "enable-ei-portal" "Disable"
	#Option "fullscreen" "Disable"
	#Option "geometry" "640x480"
	#Option "glamor" "gl"
	#Option "hidpi" "Disable"
	#Option "host-grab" "Disable"
	#Option "initfd" ""
	#Option "listen" ""
	#Option "listenfd" ""
	#Option "noTouchPointerEmulation" "Disable"
	#Option "force-xrandr-emulation" "Disable"
	#Option "nokeymap" "Disable"
	#Option "output" ""
	#Option "rootless" "Disable"
	#Option "shm" "Disable"
	#Option "verbose" "0"
	#Option "wm" ""
	#Option "OtherOptions" ""
EndSection

#
# Recommended settings for xinit (i.e. startx)
#
Section "Vendor"
	Identifier "xinit"
	Option "fullscreen"
	Option "geometry" "auto"
EndSection

#
# Recommended settings for common display managers
#

