#
# ServerFlags section
# Specifies global X server options.
# This section and its entries are optional.
#
# Option "BlankTime" "<time>" Sets the inactivity timeout in minutes for the blank phase of the screensaver; equivalent to -s flag. Default: 10
# Option "Xinerama" Enable or disable XINERAMA extension. Default: Disable
# Option "IndirectGLX" Enable or disable indirect GLX contexts. Default: Disable
#
Section "ServerFlags"
	#Option "BlankTime" "10"
	#Option "Xinerama" "Disable"
	#Option "IndirectGLX" "Disable"
EndSection

#
# Extensions section
# Specifies which X11 protocol extensions should be enabled or disabled.
# This section and its entries are optional.
#
Section "Extensions"
	#Option "Generic Event Extension" "Disable"
	#Option "SHAPE" "Disable"
	#Option "MIT-SHM" "Disable"
	#Option "XInputExtension" "Disable"
	#Option "XTEST" "Disable"
	#Option "BIG-REQUESTS" "Disable"
	#Option "SYNC" "Disable"
	#Option "XKEYBOARD" "Disable"
	#Option "XC-MISC" "Disable"
	#Option "SECURITY" "Disable"
	#Option "XINERAMA" "Disable"
	#Option "XFIXES" "Disable"
	#Option "XFree86-Bigfont" "Disable"
	#Option "RENDER" "Disable"
	#Option "RANDR" "Disable"
	#Option "COMPOSITE" "Disable"
	#Option "DAMAGE" "Disable"
	#Option "MIT-SCREEN-SAVER" "Disable"
	#Option "DOUBLE-BUFFER" "Disable"
	#Option "RECORD" "Disable"
	#Option "DPMS" "Disable"
	#Option "Present" "Disable"
	#Option "DRI3" "Disable"
	#Option "X-Resource" "Disable"
	#Option "XVideo" "Disable"
	#Option "XVideo-MotionCompensation" "Disable"
	#Option "SELinux" "Disable"
	#Option "GLX" "Disable"
EndSection

#
# Vendor section
# Provides configuration information specific to Xwslg.
# This section and its entries are optional.
# This section may be specified more than once.
#
# Identifier "<name>" If set, ignore section unless the executable name of the program that called Xwslg matches this entry.
# Option "Extend" "<name>" Inherit configuration information from other Vendor section whose Identifier entry matches this entry.
# Option "Rootless" Run rootless; requires window manager support. Default: Disable
# Option "Fullscreen" Run fullscreen when rootful. Default: Disable
# Option "Geometry" "<WxH>" Set window size when rootful; ignored if Fullscreen is enabled. Default: 640x480
# Option "HiDPI" Adjust to output scale when rootful. Default: Disable
# Option "Host-Grab" Inhibit host keyboard shortcuts and grab the mouse pointer when rootful. Default: Disable
# Option "Keymap" Use the Wayland compositor's keymap. Default: Enable
# Option "Output" "<name>" Specify which output to use for fullscreen when rootful; usually defaults to rdp-0.
# Option "WM" "<fd>" Create X client for wm on given file descriptor; unset by default.
# Option "InitFD" "<fd>" Add given file descriptor as a listen socket for initialization clients; unset by default.
# Option "ListenFD" "<fd>" Add given file descriptor as a listen socket; unset by default.
# Option "Listen" "<fd>" Deprecated synonym for ListenFD; unset by default.
# Option "SHM" Use shared memory for passing buffers. Default: Disable
# Option "Glamor" "<gl|es|off>" Use given API for Glamor acceleration; cannot be specified if SHM is enabled. Default: gl
# Option "TouchPointerEmulation" Allow touch pointer emulation. Default: Enable
# Option "Force-XRandR-Emulation" Force non-native modes to be exposed when viewporter is not supported by the compositor. Default: Disable
# Option "Decorate" Show window decorations when rootful. Default: Disable
# Option "Enable-EI-Portal" Use the XDG portal for input emulation. Default: Disable
# Option "Clipboard" Enable or disable the clipboard selection bridge. Default: Disable
# Option "OtherOptions" "<arg1> <arg2> ..." Additional command-line options to pass to Xwslg; empty by default.
#
Section "Vendor"
	#Option "Rootless" "Disable"
	#Option "Fullscreen" "Disable"
	#Option "Geometry" "640x480"
	#Option "HiDPI" "Disable"
	#Option "Host-Grab" "Disable"
	#Option "Keymap" "Enable"
	#Option "Output" "rdp-0"
	#Option "WM" "-1"
	#Option "InitFD" "-1"
	#Option "ListenFD" "-1"
	#Option "Listen" "-1"
	#Option "SHM" "Disable"
	#Option "Glamor" "gl"
	#Option "TouchPointerEmulation" "Enable"
	#Option "Force-XRandR-Emulation" "Disable"
	#Option "Decorate" "Disable"
	#Option "Enable-EI-Portal" "Disable"
	#Option "Clipboard" "Disable"
	#Option "OtherOptions" ""
EndSection

#
# Recommended settings for xinit (i.e. startx)
#
Section "Vendor"
	Identifier "xinit"
	Option "Fullscreen" "Enable"
EndSection

#
# Recommended settings for common display managers
#

#
# Entrance
#
Section "Vendor"
	Identifier "entrance"
	Option "Extend" "xinit"
EndSection

#
# GDM
#
Section "Vendor"
	Identifier "gdm-x-session"
	Option "Extend" "xinit"
EndSection

#
# LightDM
# NB: In lightdm.conf, set logind-check-graphical to false, otherwise LightDM won't start.
#
Section "Vendor"
	Identifier "lightdm"
	Option "Extend" "xinit"
EndSection

#
# LXDM
#
Section "Vendor"
	Identifier "lxdm-binary"
	Option "Extend" "xinit"
EndSection

#
# SLiM
#
Section "Vendor"
	Identifier "slim"
	Option "Extend" "xinit"
EndSection

#
# WINGs Display Manager
#
Section "Vendor"
	Identifier "wdm"
	Option "Extend" "xinit"
EndSection

#
# XDM
#
Section "Vendor"
	Identifier "xdm"
	Option "Extend" "xinit"
EndSection
